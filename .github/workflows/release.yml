name: release

# Tag v<version> (matching Cargo.toml and senclaw-runtime.json) -> build,
# test, package, and publish the archive + checksum as release assets, the
# way every sen-* runtime does (runtime-protocol.md §2.3).
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon: the MLX build, packaged with its mlx.metallib.
          - os: macos-14
            platform: darwin-arm64
          # Everywhere else: the pure-Rust Candle backend on the CPU.
          - os: ubuntu-latest
            platform: linux-x64
          - os: windows-latest
            platform: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - name: checkout sen-whisper
        uses: actions/checkout@v4
        with:
          path: sen-whisper

      # sen-runtime-sdk is a path dependency (../senclaw/crates/sen-runtime-sdk);
      # checked out as a sibling so it resolves the same way it does locally.
      - name: checkout senclaw (sibling, for sen-runtime-sdk)
        uses: actions/checkout@v4
        with:
          repository: SenClaw/senclaw
          path: senclaw

      - name: install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: build
        working-directory: sen-whisper
        shell: bash
        run: make build PROFILE=release

      - name: test
        working-directory: sen-whisper
        shell: bash
        run: make test

      - name: package
        working-directory: sen-whisper
        shell: bash
        run: make package PROFILE=release

      - name: release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            sen-whisper/dist/*.tar.gz
            sen-whisper/dist/*.sha256
